version: '3.8'

services:
  caddy:
    image: caddy:alpine
    container_name: zoink_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoink_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  ml_engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: zoink_ml_engine
    ports:
      - "8001:8001"
    env_file:
      - ./ml_engine/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the secure domains to the frontend during build
        - VITE_API_BASE_URL=https://zoink4u.praneeshrv.me/api
        - VITE_ML_BASE_URL=https://zoink4u.praneeshrv.me/ml
    container_name: zoink_frontend
    depends_on:
      - backend
      - ml_engine
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
