services:
  # 1. Frontend Static Site
  - type: web
    name: zoink-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      # These will need to be updated with the generated render.com URLs once created
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ML_BASE_URL
        sync: false
        
  # 2. Backend Web Service
  - type: web
    name: zoink-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WAQI_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0

  # 3. ML Engine Web Service
  - type: web
    name: zoink-ml-engine
    env: python
    rootDir: ml_engine
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
